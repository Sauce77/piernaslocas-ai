{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/plai-palette.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        /* Contenedor principal para posicionamiento relativo */
        #main-container {
            position: relative;
            /* Usamos la clase Bootstrap 'shadow-lg' para el borde */
        }
        /* El canvas se superpone al video */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Aplica el efecto espejo CSS tanto al video como al canvas */
        #video, #canvas {
            transform: scaleX(-1);
        }
        #video {
            display: block; 
            /* Para que el video no interfiera con el canvas */
        }
    </style>
{% endblock %}

{% block title %}piernaslocas{% endblock %}

{% block content %}

    <div class="container my-5 text-center">
        <h1 class="mb-4">Ejercicio: {{ ejercicio.nombre }}</h1>
        
        <div id="loading" class="alert alert-info">Cargando modelo y cámara...</div>

        <div class="d-flex justify-content-between">
            <div id="main-container" class="shadow-lg mx-auto" style="width: 640px; height: 480px;">
                <video id="video" playsinline width="640" height="480"></video>
                <canvas id="canvas" width="640" height="480"></canvas>
            </div>

            <div>
                <h2>{{ ejercicio.nombre }}</h2>
                <p>{{ ejercicio.descripcion }}</p>
            </div>
        </div>

        <div class="d-flex flex-columns">
            <a href="{% url 'sesiones:rutinas' %}" class="btn btn-danger">Cancelar</a>
        </div>
        
    </div>

    <script type="application/json">
        {{ ejercicio.data|json_script:"targets-json" }}
    </script>

    <script>
        // --- COMIENZA CÓDIGO JAVASCRIPT ---

        // 1. Variables globales
        let detector;
        let video;
        let canvas;
        let ctx;
        const VIDEO_WIDTH = 640;
        const VIDEO_HEIGHT = 480;
        const LOADING_ELEM = document.getElementById('loading');

        // 2. Definición de OBJETIVOS (Targets) para Rodillas y Tobillos
        // Leemos el JSON inyectado por Django mediante json_script
        const jsonScriptNode = document.getElementById('targets-json');
        
        let TARGETS = []; // Inicializamos vacío

        if (jsonScriptNode) {
            try {
                const parsedData = JSON.parse(jsonScriptNode.textContent);
                
                // Procesamos los datos para asegurar que tengan la propiedad 'hit'
                TARGETS = parsedData.map(t => ({
                    x: t.x,
                    y: t.y,
                    keypointIndex: t.keypointIndex,
                    label: t.label,
                    hit: false // Estado interno necesario para la lógica de dibujo
                }));
                
                console.log("Objetivos cargados vía JSON:", TARGETS);
            } catch (error) {
                console.error("Error parseando el JSON de objetivos:", error);
            }
        } else {
            console.warn("No se encontró el elemento JSON. Usando array vacío.");
        }

        /**
         * Configurar y Cargar el Detector MoveNet
         */
        async function setupDetector() {
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
                enableSmoothing: true
            };

            detector = await poseDetection.createDetector(model, detectorConfig);
            console.log("Detector de poses MoveNet cargado.");
            
            if(LOADING_ELEM) {
                LOADING_ELEM.className = 'alert alert-warning';
                LOADING_ELEM.innerText = 'Cámara lista. ¡Alinea tus rodillas y tobillos con los círculos!';
            }
        }

        /**
         * Configurar y Abrir la Cámara
         */
        async function setupCamera() {
            video = document.getElementById('video');

            const constraints = {
                'audio': false,
                'video': {
                    facingMode: 'user',
                    width: VIDEO_WIDTH,
                    height: VIDEO_HEIGHT
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        }

        /**
         * Bucle Principal de Detección
         */
        async function poseEstimationLoop() {
            if (!detector || !video.readyState) {
                requestAnimationFrame(poseEstimationLoop);
                return;
            }

            // 1. Estimar pose
            const poses = await detector.estimatePoses(video);
            const mainPose = (poses && poses.length > 0) ? poses[0] : null;

            // 2. Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 3. Dibujar Objetivos (Targets)
            // Se dibujan PRIMERO para que queden "detrás" del esqueleto del usuario
            drawAndCheckTargets(mainPose, ctx);

            // 4. Dibujar Esqueleto del usuario
            if (mainPose) {
                drawResult(mainPose, ctx);
            }

            // 5. Repetir
            requestAnimationFrame(poseEstimationLoop);
        }

        /**
         * Función para Dibujar y Verificar Objetivos (Knees & Ankles)
         */
        function drawAndCheckTargets(pose, ctx) {
            const HIT_THRESHOLD = 60; // Tolerancia en píxeles (Radio de éxito)
            let hitCount = 0;

            TARGETS.forEach(target => {
                let isHit = false;

                // Verificar colisión si hay pose
                if (pose) {
                    const userPart = pose.keypoints[target.keypointIndex];
                    // Solo verificamos si la confianza de la detección es buena (> 0.3)
                    if (userPart && userPart.score > 0.3) {
                        const dist = Math.hypot(userPart.x - target.x, userPart.y - target.y);
                        if (dist < HIT_THRESHOLD) {
                            isHit = true;
                            hitCount++;
                        }
                    }
                }
                
                target.hit = isHit;

                // --- Dibujo Visual del Objetivo ---
                ctx.beginPath();
                ctx.arc(target.x, target.y, 40, 0, 2 * Math.PI); // Círculo objetivo
                
                if (isHit) {
                    // ÉXITO: Relleno Verde brillante
                    ctx.fillStyle = 'rgba(50, 255, 50, 0.5)';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 4;
                } else {
                    // ESPERA: Relleno Azul transparente con borde punteado
                    ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';
                    ctx.strokeStyle = 'cyan';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([10, 5]); 
                }
                
                ctx.fill();
                ctx.stroke();
                ctx.setLineDash([]); // Resetear líneas punteadas

                // --- Dibujar Texto (Corrigiendo el efecto espejo) ---
                ctx.save();
                ctx.translate(target.x, target.y);
                ctx.scale(-1, 1); // Invertir X localmente para que el texto se lea bien
                
                ctx.fillStyle = 'white';
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(target.label, 0, 5); // Texto en el centro del círculo
                
                ctx.restore();
            });
        }

        /**
         * Función para dibujar el Esqueleto (Manual y Estable)
         */
        function drawResult(pose, ctx) {
            const minScore = 0.3; 
            
            // Lista de adyacencia manual (MoveNet Lightning)
            const ADJACENCY_LIST = [
                [0, 1], [0, 2], [1, 3], [2, 4], 
                [0, 5], [0, 6], [5, 7], [7, 9], 
                [6, 8], [8, 10], 
                [5, 11], [6, 12], [11, 13], [13, 15], 
                [12, 14], [14, 16]
            ];

            // 1. Dibujar líneas del cuerpo
            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 3;
            ADJACENCY_LIST.forEach(([i, j]) => {
                const kp1 = pose.keypoints[i];
                const kp2 = pose.keypoints[j];

                if (kp1.score > minScore && kp2.score > minScore) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.stroke();
                }
            });
            
            // 2. Dibujar puntos clave (Resaltando rodillas y tobillos)
            pose.keypoints.forEach((keypoint, i) => {
                if (keypoint.score > minScore) { 
                    const { x, y } = keypoint;
                    ctx.beginPath();

                    // Índices relevantes: 13,14 (Rodillas) - 15,16 (Tobillos)
                    if (i >= 13 && i <= 16) {
                        // Puntos de interés: Amarillo y grande
                        ctx.arc(x, y, 12, 0, 2 * Math.PI); 
                        ctx.fillStyle = '#FFD700'; // Gold
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    } else {
                        // Resto del cuerpo: Rojo normal
                        ctx.arc(x, y, 6, 0, 2 * Math.PI);  
                        ctx.fillStyle = 'red';
                    }
                    ctx.fill();
                }
            });
        }

        /**
         * Inicialización
         */
        async function init() {
            try {
                await setupCamera();
                video.play();

                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                
                // Ajuste explícito de dimensiones internas del canvas
                canvas.width = VIDEO_WIDTH;
                canvas.height = VIDEO_HEIGHT;

                await setupDetector();

                LOADING_ELEM.style.display = 'none';
                poseEstimationLoop();

            } catch (error) {
                console.error("Error:", error);
                if(LOADING_ELEM) {
                    LOADING_ELEM.className = 'alert alert-danger';
                    LOADING_ELEM.innerText = 'Error: ' + error.message;
                }
            }
        }

        init();

        // --- FINALIZA CÓDIGO JAVASCRIPT ---
    </script>

{% endblock %}
