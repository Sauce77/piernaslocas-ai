{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/plai-palette.css' %}">
{% endblock %}

{% block title %}Historial{% endblock %}

{% block content%}

    <div class="d-flex flex-columns justify-content-between my-3">
        <h1>Sesiones</h1>
        <a href="{% url 'sesiones:historial' username=user.username %}" class="btn boton-secundario">Historial</a>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for rutina in rutinas %}
            <div class="col">
                <div class="card h-100 text-center">
                    <img src="{% static 'img/sesiones/rutina_piernas.png' %}" alt="profile_photo" style="width: 100%; height: 15rem;">
                    <div class="card-body">
                        <h5 class="card-title">{{ rutina.nombre }}</h5>
                        <p class="card-text">{{ rutina.descripcion }}</p>

                        <a href="{% url 'sesiones:ejercicios' id_rutina=rutina.pk %}" class="btn boton-primario px-5">Ver</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
