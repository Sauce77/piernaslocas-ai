{% extends 'base.html' %}
{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/plai-palette.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        /* Contenedor principal para posicionamiento relativo */
        #main-container {
            position: relative;
            /* Usamos la clase Bootstrap 'shadow-lg' para el borde */
        }
        /* El canvas se superpone al video */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Aplica el efecto espejo CSS tanto al video como al canvas */
        #video, #canvas {
            transform: scaleX(-1);
        }
        #video {
            display: block; 
            /* Para que el video no interfiera con el canvas */
        }
    </style>
{% endblock %}

{% block title %}piernaslocas{% endblock %}

{% block content %}

    <div class="container my-5 text-center">
        <h1 class="mb-4">Detección de Poses (MoveNet) con Bootstrap 5</h1>
        
        <div id="loading" class="alert alert-info">Cargando modelo y cámara...</div>

        <div id="main-container" class="shadow-lg mx-auto" style="width: 640px; height: 480px;">
            <video id="video" playsinline width="640" height="480"></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>
    </div>

    <script>
        // --- COMIENZA CÓDIGO JAVASCRIPT ---

        // Variables globales
        let detector;
        let video;
        let canvas;
        let ctx;
        const VIDEO_WIDTH = 640;
        const VIDEO_HEIGHT = 480;
        const LOADING_ELEM = document.getElementById('loading');


        /**
         * 1. Configurar y Cargar el Detector MoveNet
         */
        async function setupDetector() {
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
                enableSmoothing: true
            };

            detector = await poseDetection.createDetector(model, detectorConfig);
            console.log("Detector de poses MoveNet cargado.");
            LOADING_ELEM.className = 'alert alert-warning';
            LOADING_ELEM.innerText = 'Cámara lista, iniciando detección...';
        }

        /**
         * 2. Configurar y Abrir la Cámara
         */
        async function setupCamera() {
            video = document.getElementById('video');

            const constraints = {
                'audio': false,
                'video': {
                    facingMode: 'user',
                    width: VIDEO_WIDTH,
                    height: VIDEO_HEIGHT
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        }

        /**
         * 3. Bucle Principal de Detección (Actualización continua)
         */
        async function poseEstimationLoop() {
            if (!detector || !video.readyState) {
                requestAnimationFrame(poseEstimationLoop);
                return;
            }

            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (poses && poses.length > 0) {
                drawResult(poses[0], ctx);
            }

            requestAnimationFrame(poseEstimationLoop);
        }

        /**
         * 4. Función auxiliar para dibujar la pose (Usando lista manual estable)
         */
        function drawResult(pose, ctx) {
            const minScore = 0.3; 
            
            // Lista de adyacencia manual para MoveNet (Estable y compatible)
            const ADJACENCY_LIST = [
                [0, 1], [0, 2], [1, 3], [2, 4], 
                [0, 5], [0, 6], [5, 7], [7, 9], 
                [6, 8], [8, 10], 
                [5, 11], [6, 12], [11, 13], [13, 15], 
                [12, 14], [14, 16]
            ];

            // Dibujar el "esqueleto" (conexiones)
            ADJACENCY_LIST.forEach(([i, j]) => {
                const kp1 = pose.keypoints[i];
                const kp2 = pose.keypoints[j];

                if (kp1.score > minScore && kp2.score > minScore) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'lime';
                    ctx.stroke();
                }
            });
            
            // Dibujar puntos clave (Keypoints)
            for (const keypoint of pose.keypoints) {
                if (keypoint.score > minScore) { 
                    const { x, y } = keypoint;
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, 2 * Math.PI); 
                    ctx.fillStyle = 'red';
                    ctx.fill();
                }
            }
        }

        /**
         * 5. Inicialización principal
         */
        async function init() {
            try {
                // Configurar la cámara y los elementos de visualización
                await setupCamera();
                video.play();

                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                // Ya definimos los atributos width/height en el HTML

                // Cargar el modelo TF.js
                await setupDetector();

                // Iniciar el bucle de detección en tiempo real
                LOADING_ELEM.style.display = 'none';
                poseEstimationLoop();

            } catch (error) {
                console.error("Error al inicializar la aplicación:", error);
                LOADING_ELEM.className = 'alert alert-danger';
                LOADING_ELEM.innerText = 'Error: No se pudo acceder a la cámara o cargar el modelo. Verifica los permisos de la cámara.';
            }
        }

        init();
        
        // --- FINALIZA CÓDIGO JAVASCRIPT ---
    </script>

{% endblock %}
