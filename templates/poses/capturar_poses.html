<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de Poses con TensorFlow.js y MoveNet</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #main-container {
            position: relative;
            margin-top: 20px;
        }
        /* El canvas se superpone al video */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        /* El efecto espejo CSS ayuda a que el usuario se vea reflejado */
        #video, #canvas {
            transform: scaleX(-1);
        }
        #video {
            display: block; 
        }
        #loading {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>
<body>

    <h1>Detección de Poses (MoveNet)</h1>
    <div id="loading">Cargando modelo y cámara...</div>

    <div id="main-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // --- COMIENZA CÓDIGO JAVASCRIPT ---

        // Variables globales
        let detector;
        let video;
        let canvas;
        let ctx;
        const VIDEO_WIDTH = 640;
        const VIDEO_HEIGHT = 480;

        /**
         * 1. Configurar y Cargar el Detector MoveNet
         */
        async function setupDetector() {
            const model = poseDetection.SupportedModels.MoveNet;
            const detectorConfig = {
                modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING, // Rápido y eficiente
                enableSmoothing: true
            };

            detector = await poseDetection.createDetector(model, detectorConfig);
            console.log("Detector de poses MoveNet cargado.");
            document.getElementById('loading').innerText = 'Cámara lista, iniciando detección...';
        }

        /**
         * 2. Configurar y Abrir la Cámara
         */
        async function setupCamera() {
            video = document.getElementById('video');

            const constraints = {
                'audio': false,
                'video': {
                    facingMode: 'user',
                    width: VIDEO_WIDTH,
                    height: VIDEO_HEIGHT
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.width = VIDEO_WIDTH;
                    video.height = VIDEO_HEIGHT;
                    resolve(video);
                };
            });
        }

        /**
         * 3. Bucle Principal de Detección (Actualización continua)
         */
        async function poseEstimationLoop() {
            if (!detector || !video.readyState) {
                requestAnimationFrame(poseEstimationLoop);
                return;
            }

            // Estimar la pose
            const poses = await detector.estimatePoses(video);

            // Limpiar el canvas del frame anterior
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Si quieres ver el video bajo el esqueleto, descomenta la línea:
            // ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Dibujar la pose detectada
            if (poses && poses.length > 0) {
                drawResult(poses[0], ctx);
            }

            // ¡Clave para la actualización continua! Llama a la función antes del siguiente repaint.
            requestAnimationFrame(poseEstimationLoop);
        }

        /**
         * 4. Función auxiliar para dibujar la pose
         */
        function drawResult(pose, ctx) {
    const minScore = 0.3; // Umbral de confianza mínimo
    
    // === LISTA DE ADYACENCIA MANUAL PARA MOVENET ===
    // Esta lista define qué puntos clave están conectados (ej: HombroIzquierdo a CodoIzquierdo)
    // Los números son los índices del array 'pose.keypoints'.
    const ADJACENCY_LIST = [
        [0, 1], [0, 2], [1, 3], [2, 4], // Cabeza
        [0, 5], [0, 6], [5, 7], [7, 9], // Brazo izquierdo
        [6, 8], [8, 10], // Brazo derecho
        [5, 11], [6, 12], [11, 13], [13, 15], // Cuerpo y pierna izquierda
        [12, 14], [14, 16] // Cuerpo y pierna derecha
    ];


    // Dibujar el "esqueleto" (conexiones)
    ADJACENCY_LIST.forEach(([i, j]) => {
        const kp1 = pose.keypoints[i];
        const kp2 = pose.keypoints[j];

        if (kp1.score > minScore && kp2.score > minScore) {
            ctx.beginPath();
            ctx.moveTo(kp1.x, kp1.y);
            ctx.lineTo(kp2.x, kp2.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'lime';
            ctx.stroke();
        }
    });
    
    // Dibujar puntos clave (Keypoints)
    for (const keypoint of pose.keypoints) {
        if (keypoint.score > minScore) { 
            const { x, y } = keypoint;
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, 2 * Math.PI); 
            ctx.fillStyle = 'red';
            ctx.fill();
        }
    }
}

        /**
         * 5. Inicialización principal
         */
        async function init() {
            try {
                // 1. Configurar la cámara y los elementos de visualización
                await setupCamera();
                video.play();

                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d');
                canvas.width = VIDEO_WIDTH;
                canvas.height = VIDEO_HEIGHT;

                // 2. Cargar el modelo TF.js
                await setupDetector();

                // 3. Iniciar el bucle de detección en tiempo real
                document.getElementById('loading').style.display = 'none';
                poseEstimationLoop();

            } catch (error) {
                console.error("Error al inicializar la aplicación:", error);
                document.getElementById('loading').innerText = 'Error: No se pudo acceder a la cámara o cargar el modelo. (Detalle: ' + error.message + ')';
            }
        }

        init();
        
        // --- FINALIZA CÓDIGO JAVASCRIPT ---
    </script>

</body>
</html>
